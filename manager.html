<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Manager Dashboard</title>
  <link rel="stylesheet" href="Css/manager.css">
</head>
<body>

  <div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="profile">
        <div class="circle2"></div>
        <p class="email">user@gmail.com</p>
      </div>

      <nav>
        <ul>
          <li><span class="icon">🔔</span> Notifications</li>
          <li><span class="icon">⚙️</span> Settings</li>
        </ul>
      </nav>

      <button class="logout">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <h1> Manager Dashboard</h1>

      <button class="check-btn">Check new request</button>

      <div class="cards">
        <div class="card">
          <div class="circle1"></div>
          <p>Total request received</p>
          <button class="view-btn">View details</button>
        </div>

    

        <div class="card">
          <div class="circle"></div>
          <p>Total request approved</p>
          <button class="view-btn">View details</button>
        </div>
      </div>
    </main>
  </div>
  <script src="Js/manager.js"></script>

</body>
</html>
