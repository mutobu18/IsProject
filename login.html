<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Visitor Management System</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
   <!-- LOGIN FORM -->
    <div class="login-container" id="loginContainer">
        <h2><strong>VMS</strong></h2>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username or email" required>
                <small class="hint">Enter any username </small>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
                <p class="password-error" id="loginPassError"></p>
                <small class="hint">Password must be exactly 6 characters</small>
            </div>
            <div class="input-group">
                <label for="role">Select Role</label>
                <select id="role" required>
                    <option value="">--Select Role--</option>
                    <option value="student">Student Resident</option>
                    <option value="manager">Hostel Manager</option>
                    <option value="security">Security Officer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit">Login</button>
            <div class="forgot-container">
    <a href="#" id="forgotPassword">Forgot Password?</a>
</div>
        </form>
        <p id="message"></p>
        <p class="switch-form">
            Don’t have an account? <a href="#" id="showSignup">Sign Up</a>
        </p>
    </div>
    <!-- SIGNUP FORM -->
    <div class="signup-container" id="signupContainer">
        <h2>Create an Account</h2>

        <form id="signupForm">
            <div class="input-group">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" placeholder="Choose a username" required>
            </div>

            <div class="input-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" placeholder="Create a password" required>
                <p class="password-error" id="signupPassError"></p>
                <small class="hint">Password must be exactly 6 characters</small>
            </div>

            <div class="input-group">
                <label for="signupRole">Role</label>
                <select id="signupRole" required>
                    <option value="">--Select Role--</option>
                    <option value="student">Student Resident</option>
                    <option value="manager">Hostel Manager</option>
                    <option value="security">Security Officer</option>
                </select>
            </div>

            <button type="submit">Sign Up</button>
            <p id="signupMessage"></p>

            <p class="switch-form">
                Already have an account? <a href="#" id="showLogin">Login</a>
            </p>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
